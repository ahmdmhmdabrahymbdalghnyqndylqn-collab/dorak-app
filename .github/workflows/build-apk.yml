name: Build Dorak APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare download file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Dorak-Test.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dorak-Test-APK
          path: Dorak-Test.apk
          retention-days: 30

      - name: Publish public test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${GITHUB_RUN_NUMBER}" Dorak-Test.apk \
            --title "دَوْرَك - نسخة تجريبية ${GITHUB_RUN_NUMBER}" \
            --notes "نسخة تجريبية قابلة للتثبيت على أجهزة Android."
