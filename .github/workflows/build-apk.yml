name: Build Dorak APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK
        env:
          NODE_ENV: production
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify embedded JavaScript bundle
        run: |
          test -f android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle
          test -f android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare download file
        run: cp android/app/build/outputs/apk/release/app-release.apk Dorak-Standalone.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dorak-Standalone-APK
          path: Dorak-Standalone.apk
          retention-days: 30

      - name: Publish public test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "standalone-${GITHUB_RUN_NUMBER}" Dorak-Standalone.apk \
            --title "دَوْرَك - نسخة مستقلة ${GITHUB_RUN_NUMBER}" \
            --notes "نسخة Android مستقلة تحتوي على كود التطبيق بالكامل ولا تحتاج Metro أو اتصالاً بالكمبيوتر."
